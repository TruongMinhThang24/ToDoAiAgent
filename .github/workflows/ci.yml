name: 🧪 CI Pipeline (AI Tester & Reviewer)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-checks:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install system deps for audio (portaudio)
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install backend dependencies (Poetry)
        working-directory: ./backend
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi --with dev

      - name: 🔐 AI Security & Lint Check (Ruff)
        working-directory: ./backend
        run: |
          poetry run ruff check src/

      - name: 🧪 Run Unit Tests
        working-directory: ./backend
        run: |
          poetry run pytest -q

  docker-backend-test:
    name: Docker Backend Test
    runs-on: ubuntu-latest
    needs: backend-checks
    steps:
      - uses: actions/checkout@v3

      - name: Install system deps for audio (portaudio) on runner
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend test image
        run: |
          docker build -f backend/Dockerfile.test -t todos-backend-test:latest backend

      - name: Run tests inside container
        run: |
          docker run --rm todos-backend-test:latest

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          
      - name: Install dependencies
        working-directory: ./frontend/todo-frontend
        run: npm ci || npm install
        
      - name: 📝 Frontend Code Quality (ESLint)
        working-directory: ./frontend/todo-frontend
        run: npm run lint
        
      - name: 🏗️ Test Build
        working-directory: ./frontend/todo-frontend
        run: npm run build