[project]
name = "Todos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<4.0.0"

dependencies = [
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.118.0",
    "isort (>=7.0.0,<8.0.0)",
    "pandas>=2.3.3",
    "passlib[bcrypt]>=1.7.4",
    "psutil>=7.1.0",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.1.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.43",
    "langgraph (>=1.0.1,<2.0.0)",
    "langchain-google-genai (>=3.0.0,<4.0.0)",
    "langgraph-checkpoint-sqlite (>=3.0.0,<4.0.0)",
    "chromadb (>=1.2.1,<2.0.0)",
    "langchain-chroma (>=1.0.0,<2.0.0)",
    "langchain-text-splitters (>=1.0.0,<2.0.0)",
    "pypdf (>=6.1.3,<7.0.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "flashrank (>=0.2.10,<0.3.0)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "langchain-tavily (>=0.2.12,<0.3.0)",
    "tavily-python (>=0.7.12,<0.8.0)",
    "langsmith (>=0.4.38,<0.5.0)",
    "google-genai (>=1.48.0,<2.0.0)",
    "pydub (>=0.25.1,<0.26.0)",
    "pyaudio (>=0.2.14,<0.3.0)",
    "audioop-lts (>=0.2.2,<0.3.0)",
    "apscheduler (>=3.11.1,<4.0.0)",
    "websockets (>=15.0.1,<16.0.0)",
    "dateparser (>=1.2.2,<2.0.0)",
    "aiosqlite (>=0.21.0,<0.22.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "pytz (>=2025.2,<2026.0)",
]

[tool.poetry]
packages = [
    { include = "todo_backend", from = "src" }
]
[dependency-groups]
dev = [
    "ipykernel (>=7.0.1,<8.0.0)",
    "alembic (>=1.17.1,<2.0.0)"
]
